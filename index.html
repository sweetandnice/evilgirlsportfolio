<!DOCTYPE html>
<html lang="en">  
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evil Girls Portfolio</title>

<style>
body {
  background-color: black;
  margin: 0;
  padding: 0;
}

/* DESKTOP GRID — FIXED WIDTHS */
.header {
  display: grid;
  grid-template-columns: 1fr 1fr; /* equal width columns */
  gap: 20px;
  padding: 20px;
  align-items: center;
}

/* FLICKERING TEXT HEADER */
.header-flicker {
  width: 100%;
  height: auto;
  display: block;
  animation: flicker-text 0.8s infinite alternate;
  content: url("headers/header1.png");
}

/* TEXT FLICKER ANIMATION */
@keyframes flicker-text {
  0%   { content: url("headers/header1.png"); }
  15%  { content: url("headers/header2.png"); }
  30%  { content: url("headers/header1.png"); }
  45%  { content: url("headers/header2.png"); }
  60%  { content: url("headers/header2.png"); }
  75%  { content: url("headers/header1.png"); }
  90%  { content: url("headers/header2.png"); }
  100% { content: url("headers/header1.png"); }
}

/* EYE BUTTONS — DESKTOP FIX */
.eye-row {
  display: flex;
  flex-direction: row;
  gap: 20px;
}

.eye-row img {
  width: 100%; 
  height: auto;
  cursor: pointer;
}

/* MOBILE LAYOUT — FIXED SIZING */
@media (max-width: 768px) {
  .header {
    grid-template-columns: 1fr;
    text-align: center;
  }

  .eye-row {
    flex-direction: row;
    justify-content: center;
    gap: 10px;
  }

  .eye-row img {
    width: 48%;
  }
}
</style>

</head>

<body>

<div class="header">

  <!-- FLICKERING TEXT -->
  <img class="header-flicker">

  <!-- CLICKABLE EYE BUTTONS -->
  <div class="eye-row">
    <a href="LINK1">
      <img src="headers/mc_eye.png" alt="MC Eye">
    </a>

    <a href="LINK2">
      <img src="headers/hd_eye.png" alt="HD Eye">
    </a>
  </div>

</div>

</body>
</html>
