<!DOCTYPE html>
<html lang="en">  
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evil Girls Portfolio</title>

<style>
@font-face {
  font-family: "BasteleurBold";
  src: url("webfonts/Basteleur-Bold.woff2") format("woff2"),
       url("webfonts/Basteleur-Bold.woff") format("woff");
  font-weight: bold;
  font-style: normal;
}

@font-face {
  font-family: "FT88Gothique";
  src: url("webfonts/FT88-Gothique.otf") format("opentype"),
       url("webfonts/FT88-Gothique.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
}

body {
  background-color: #f2db85;
  margin: 0;
  padding: 0;
}

/* HEADER GRID — DESKTOP */
.header {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 20px;
  padding: 20px;
  align-items: center;
}

/* TEXT IMAGES (header1 + header2) */
.header-text {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.header-text img {
  width: 100%;
  height: auto;
}

/* CLICKABLE EYE IMAGES */
.header-eyes {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.header-eyes img {
  width: 100%;
  height: auto;
  cursor: pointer;
}

/* MOBILE LAYOUT */
@media (max-width: 768px) {
  .header {
    grid-template-columns: 1fr;
    text-align: center;
  }

  .header-eyes {
    flex-direction: row;
    justify-content: center;
  }

  .header-eyes img {
    width: 45%;
  }
}
</style>

</head>

<body>

<div class="header">

  <!-- TEXT IMAGES -->
  <div class="header-text">
    <img src="headers/header1.png" alt="Header Text 1">
    <img src="headers/header2.png" alt="Header Text 2">
  </div>

  <!-- CLICKABLE EYE BUTTONS -->
  <div class="header-eyes">
    <a href="LINK1">
      <img src="headers/mc_eye.png" alt="MC Eye">
    </a>

    <a href="LINK2">
      <img src="headers/hd_eye.png" alt="HD Eye">
    </a>
  </div>

</div>

</body>
</html>
