<!DOCTYPE html>
<html lang="en">  
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evil Girls Portfolio</title>

<style>
@font-face {
  font-family: "BasteleurBold";
  src: url("webfonts/Basteleur-Bold.woff2") format("woff2"),
       url("webfonts/Basteleur-Bold.woff") format("woff");
  font-weight: bold;
  font-style: normal;
}

@font-face {
  font-family: "FT88Gothique";
  src: url("webfonts/FT88-Gothique.otf") format("opentype"),
       url("webfonts/FT88-Gothique.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
}

body {
  background-color: #f2db85;
  margin: 0;
  padding: 0;
}

/* Desktop header default */
.header-img {
  width: 100%;
  height: auto;
  display: block;
  animation: flicker 1s infinite alternate;
  content: url("headers/desktop_header1.png");
}

/* Flicker animation swaps between two desktop images */
@keyframes flicker {
  0% { content: url("headers/desktop_header1.png"); }
  100% { content: url("headers/desktop_header2.png"); }
}

/* Mobile override */
@media (max-width: 768px) {
  .header-img {
    animation: flicker-mobile 1s infinite alternate;
    content: url("headers/mobile_header1.png");
  }

  @keyframes flicker-mobile {
    0% { content: url("headers/mobile_header1.png"); }
    100% { content: url("headers/mobile_header2.png"); }
  }
}
</style>

</head>

<body>

<img class="header-img">

</body>
</html>
