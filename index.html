<!DOCTYPE html>
<html lang="en">  
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evil Girls Portfolio</title>

<style>
@font-face {
  font-family: "BasteleurBold";
  src: url("webfonts/Basteleur-Bold.woff2") format("woff2"),
       url("webfonts/Basteleur-Bold.woff") format("woff");
  font-weight: bold;
  font-style: normal;
}

@font-face {
  font-family: "FT88Gothique";
  src: url("webfonts/FT88-Gothique.otf") format("opentype"),
       url("webfonts/FT88-Gothique.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
}

body {
  background-color: #f2db85;
  margin: 0;
  padding: 0;
}

/* Default: desktop header */
.header-img {
  width: 100%;
  height: auto;
  display: block;
  animation: flicker-desktop 0.8s infinite;
  content: url("headers/desktop_header1.png");
}

/* Desktop flicker animation */
@keyframes flicker-desktop {
  0%   { content: url("headers/desktop_header1.png"); }
  10%  { content: url("headers/desktop_header2.png"); }
  25%  { content: url("headers/desktop_header1.png"); }
  40%  { content: url("headers/desktop_header2.png"); }
  55%  { content: url("headers/desktop_header2.png"); }
  70%  { content: url("headers/desktop_header1.png"); }
  85%  { content: url("headers/desktop_header2.png"); }
  100% { content: url("headers/desktop_header1.png"); }
}

/* Mobile override */
@media (max-width: 768px) {
  .header-img {
    animation: flicker-mobile 0.8s infinite;
    content: url("headers/mobile_header1.png");
  }

  @keyframes flicker-mobile {
    0%   { content: url("headers/mobile_header1.png"); }
    15%  { content: url("headers/mobile_header2.png"); }
    30%  { content: url("headers/mobile_header1.png"); }
    45%  { content: url("headers/mobile_header2.png"); }
    60%  { content: url("headers/mobile_header2.png"); }
    75%  { content: url("headers/mobile_header1.png"); }
    90%  { content: url("headers/mobile_header2.png"); }
    100% { content: url("headers/mobile_header1.png"); }
  }
}
</style>

</head>

<body>

<img class="header-img">

</body>
</html>
